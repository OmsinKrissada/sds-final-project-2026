apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: quizbox-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.0.240-192.168.0.250
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: quizbox-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - quizbox-pool
